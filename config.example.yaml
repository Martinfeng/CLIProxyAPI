# Minimal v8 configuration for the two official containers.
# Keep your existing config.yaml when migrating an existing deployment.
# Full configuration reference:
# https://github.com/router-for-me/CLIProxyAPI/blob/main/config.example.yaml
config-version: 8

server:
  host: ""
  port: 8317

management:
  # The Manager container connects over the Compose network.
  allow-remote: true
  # MANAGEMENT_PASSWORD is supplied by Compose from MANAGEMENT_KEY.
  secret-key: ""
  disable-control-panel: false
  panel-github-repository: "https://github.com/seakee/CPA-Manager-Plus"

access:
  # Replace this placeholder with a real client API key before starting CPA.
  api-keys:
    - "your-api-key-1"

oauth:
  auth-dir: "~/.cli-proxy-api"

observability:
  logs:
    logging-to-file: true
    logs-max-total-size-mb: 0
    error-logs-max-files: 10
    # Enable only if full request/response bodies are needed in ./logs.
    request-log: false
  usage:
    usage-statistics-enabled: true
    redis-usage-queue-retention-seconds: 60
