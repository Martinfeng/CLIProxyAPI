name: Sync Upstream and Build

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no changes'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: router-for-me/CLIProxyAPI
  UPSTREAM_BRANCH: main
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || 'kaelsen/cli-proxy-api' }}

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
      new_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Check for upstream changes
        id: check
        run: |
          # Get the merge base and upstream head
          MERGE_BASE=$(git merge-base HEAD upstream/${{ env.UPSTREAM_BRANCH }}) || true
          UPSTREAM_HEAD=$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})

          if [ "$MERGE_BASE" = "$UPSTREAM_HEAD" ]; then
            echo "No new commits from upstream"
            echo "has_upstream_changes=false" >> $GITHUB_OUTPUT
          else
            echo "New commits available from upstream"
            echo "has_upstream_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes
        id: sync
        run: |
          if [ "${{ steps.check.outputs.has_upstream_changes }}" = "true" ]; then
            echo "Attempting to merge upstream/${{ env.UPSTREAM_BRANCH }}..."
            PRE_MERGE_HEAD=$(git rev-parse HEAD)
            AUTO_KEEP_PREFIX=".github/workflows/"

            # Keep fork-owned workflow files unchanged because pushes that modify
            # .github/workflows/* can be rejected without extra workflow scope.
            if ! git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-ff --no-commit; then
              CONFLICT_FILES="$(git diff --name-only --diff-filter=U || true)"
              if [ -z "$CONFLICT_FILES" ]; then
                echo "::error::Merge failed before conflict paths could be identified."
                git merge --abort || true
                echo "has_changes=false" >> $GITHUB_OUTPUT
                exit 1
              fi

              NON_AUTOMERGE_CONFLICTS=0
              while IFS= read -r path; do
                [ -n "$path" ] || continue
                case "$path" in
                  "$AUTO_KEEP_PREFIX"*)
                    echo "Keeping fork-managed file: $path"
                    git checkout --ours -- "$path"
                    git add "$path"
                    ;;
                  *)
                    echo "Conflicting non-workflow file: $path"
                    NON_AUTOMERGE_CONFLICTS=1
                    ;;
                esac
              done < <(printf '%s\n' "$CONFLICT_FILES")

              if [ "$NON_AUTOMERGE_CONFLICTS" -ne 0 ]; then
                echo "::error::Merge conflict detected outside fork-managed workflow files. Manual resolution required."
                git merge --abort || true
                echo "has_changes=false" >> $GITHUB_OUTPUT
                exit 1
              fi

              echo "Auto-resolved workflow-only conflicts by keeping fork versions."
            fi

            if [ -d .github/workflows ]; then
              git restore --staged --worktree --source="$PRE_MERGE_HEAD" .github/workflows || true
            fi

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Unresolved merge conflicts remain after workflow conflict handling."
              git merge --abort || true
              echo "has_changes=false" >> $GITHUB_OUTPUT
              exit 1
            fi

            if git diff --cached --quiet; then
              echo "No effective changes after preserving local workflow files"
              git merge --abort || true
              if [ "${{ inputs.force_build }}" = "true" ]; then
                echo "Force build requested"
                echo "has_changes=true" >> $GITHUB_OUTPUT
              else
                echo "has_changes=false" >> $GITHUB_OUTPUT
              fi
              exit 0
            fi

            git commit --no-edit
            echo "Merge successful"
            echo "has_changes=true" >> $GITHUB_OUTPUT

            if ! git push origin ${{ github.ref_name }}; then
              echo "::error::Push failed. Check token/repository permissions."
              exit 1
            fi
          else
            echo "No changes to merge"
            if [ "${{ inputs.force_build }}" = "true" ]; then
              echo "Force build requested"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate version
        id: version
        if: steps.sync.outputs.has_changes == 'true' || inputs.force_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get upstream latest release version
          UPSTREAM_VERSION=$(gh release view --repo ${{ env.UPSTREAM_REPO }} --json tagName -q '.tagName' 2>/dev/null || echo "v0.0.0")
          echo "Upstream version: $UPSTREAM_VERSION"

          # Get our latest release to determine fork number
          LATEST_RELEASE=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "")
          echo "Our latest release: $LATEST_RELEASE"

          # Extract fork number if exists, otherwise start at 1
          if [[ "$LATEST_RELEASE" =~ ^${UPSTREAM_VERSION}-fork\.([0-9]+)$ ]]; then
            # Same upstream version, increment fork number
            FORK_NUM=$((${BASH_REMATCH[1]} + 1))
          else
            # New upstream version or first release, start at 1
            FORK_NUM=1
          fi

          VERSION="${UPSTREAM_VERSION}-fork.${FORK_NUM}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "upstream_version=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

  build-and-push:
    needs: sync-upstream
    if: needs.sync-upstream.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Build Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "VERSION=${{ needs.sync-upstream.outputs.new_version }}" >> $GITHUB_ENV
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          PANEL_VERSION=$(gh release view --repo seakee/CPA-Manager-Plus --json tagName -q '.tagName' 2>/dev/null || echo "unknown")
          echo "PANEL_VERSION=$PANEL_VERSION" >> $GITHUB_ENV
          echo "Embedded panel version: $PANEL_VERSION"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create sync summary
        run: |
          echo "## Sync and Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ env.COMMIT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date:** ${{ env.BUILD_DATE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image:** \`${{ env.DOCKERHUB_REPO }}:${{ env.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.DOCKERHUB_REPO }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate release notes
          cat > release-notes.md << EOF
          本项目是 [router-for-me/CLIProxyAPI](https://github.com/router-for-me/CLIProxyAPI) 的 Fork 版本，整合 [seakee/CPA-Manager-Plus](https://github.com/seakee/CPA-Manager-Plus) 作为 Manager Server，提供 SQLite 持久化的请求统计、模型价格、Codex 巡检等完整管理能力。

          > 不需要以下增强建议直接使用 [原项目](https://github.com/router-for-me/CLIProxyAPI)。

          ## 一键部署

          \`\`\`bash
          curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
          curl -o config.yaml https://raw.githubusercontent.com/${{ github.repository }}/main/config.example.yaml
          docker compose up -d
          \`\`\`

          升级：\`docker compose pull && docker compose up -d\`

          ## 首次部署后的操作（必读）

          docker-compose 起来后只是把两个服务跑了，**还需要在浏览器走一次 setup 流程**才能用上 Manager Server 的完整能力。

          ### 步骤 1：拿到 Manager 管理员密钥

          CPA-Manager-Plus 首次启动会自动生成一个 \`cmp_admin_...\` 管理员密钥，**只在第一次启动日志里打印一次**：

          \`\`\`bash
          docker compose logs cpa-manager-plus | grep -E 'cmp_admin_|admin key'
          \`\`\`

          把这串密钥保存好。如果错过这次输出，可以删掉 cpa-manager-plus 容器和 \`cpa-manager-plus-data\` volume 后重新 \`docker compose up -d\` 让它再生成一次（会丢统计数据）。

          也可以在 docker-compose.yml 的 cpa-manager-plus 服务下用 \`CPA_MANAGER_ADMIN_KEY: 你的固定密钥\` 提前指定，自己管理生命周期。

          ### 步骤 2：处理 \`./config.yaml\`（safemode + management key）

          \`config.example.yaml\` 包含演示用的 API key 占位。CPA fork 启动时会检测这些占位、进入 safemode 只起 warning 页（日志里能看到 \`unsafe example API key configured\`），导致 \`:8317\` 不可用。

          编辑 \`./config.yaml\`，两件事一起做：

          1. 在 \`api-keys\` 列表里把演示用的 key（示例像 \`sk-example-...\`）**删掉**，或者换成你真正要用的 key
          2. 在 \`remote-management.secret-key\` 填你自己定的密码（明文，CPA 启动时自动哈希）：

          \`\`\`yaml
          remote-management:
            allow-remote: false
            secret-key: "你自己定的密码"
          \`\`\`

          然后 \`docker compose restart cli-proxy-api\` 让 CPA 加载新配置。重启后日志应能看到 \`API server started successfully on: :8317\`，没有再出现 \`unsafe example API key configured\`。

          ### 步骤 3：浏览器进 Plus 完成 setup

          打开 \`http://localhost:18317/management.html\`，会进 setup 页（首次部署专属）。按顺序填：

          | 字段 | 值 |
          |---|---|
          | Manager 管理员密钥 | 步骤 1 拿到的 \`cmp_admin_...\` |
          | CPA 地址 | \`http://cli-proxy-api:8317\` |
          | CPA Management Key | 步骤 2 设的明文密码 |
          | 启用请求监控 | 建议开启 |
          | 采集轮询间隔 | 用默认 500ms 即可 |

          保存成功后，Plus 会：自动验证 CPA management API、自动打开 CPA 端的 \`usage-statistics-enabled\`、启动 \`auto\` 模式采集器（HTTP queue 优先，回退 RESP）、把 CPA 连接配置加密后存到 SQLite。

          ### 步骤 4：常态登录

          之后每次浏览器访问 \`http://localhost:18317/management.html\` 只用 Manager 管理员密钥登录，CPA Management Key 服务端托管不再输入。

          监控、模型价格、API Key 别名、用量导入导出、服务端 Codex 巡检都在这个入口下。

          ## 关于 \`:8317/management.html\`

          这个地址仍然能打开同一份 Plus panel（CPA 自动下载嵌入），用作纯 CPA 管理面板时正常。但在 Plus 设计下，**\`:8317\` 入口的监控/统计/模型价格/Codex 巡检全部不可见**，只有 \`:18317\` 入口才能用到 Manager Server 提供的能力。这是 Plus 上游的明确分工，本 fork 没有改动。

          ## 与原项目的区别

          | 功能 | 原项目 | 本 Fork |
          |------|--------|---------|
          | 请求统计持久化 | 仅内存，重启丢失 | 磁盘 JSON + 32 天保留；可选 SQLite（CPA-Manager-Plus） |
          | Management 面板 | router-for-me/Cli-Proxy-API-Management-Center | [seakee/CPA-Manager-Plus](https://github.com/seakee/CPA-Manager-Plus) |
          | 监控/模型价格/Codex 巡检 | 无 | Plus Manager Server 提供（:18317 入口） |
          | 上游同步 | - | 每 2 小时自动检查 CPA + Plus，任一更新即出 release |

          ## 仅拉镜像

          \`\`\`bash
          docker pull ${{ env.DOCKERHUB_REPO }}:${{ env.VERSION }}
          # or
          docker pull ${{ env.DOCKERHUB_REPO }}:latest
          \`\`\`

          ## 嵌入资源

          - **Embedded panel:** Panel version: ${{ env.PANEL_VERSION }}（来自 [seakee/CPA-Manager-Plus](https://github.com/seakee/CPA-Manager-Plus) 最新 release）

          ## 支持架构

          - \`linux/amd64\` — Intel / AMD 处理器
          - \`linux/arm64\` — Apple Silicon (M1/M2/M3/M4)、ARM 服务器

          ## 构建信息

          - **版本:** ${{ env.VERSION }}
          - **Commit:** ${{ env.COMMIT }}
          - **构建时间:** ${{ env.BUILD_DATE }}
          - **CPA 上游:** [${{ env.UPSTREAM_REPO }}](https://github.com/${{ env.UPSTREAM_REPO }})
          - **Panel 上游:** [seakee/CPA-Manager](https://github.com/seakee/CPA-Manager)
          EOF

          # Create release (delete existing if same version)
          gh release delete "${{ env.VERSION }}" --yes 2>/dev/null || true
          gh release create "${{ env.VERSION }}" \
            --title "Release ${{ env.VERSION }}" \
            --notes-file release-notes.md \
            --latest

      - name: Update Docker Hub README
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}
          readme-filepath: ./DOCKER_README.md
          short-description: "CLI Proxy API Fork with usage persistence and 32-day retention"

  notify-conflict:
    needs: sync-upstream
    if: ${{ always() && needs.sync-upstream.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for sync failure (if Issues enabled)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔀 Upstream Sync Failed';
            const body = `## Upstream Sync Failed

            The automatic sync with upstream repository failed.

            ### Details
            - **Upstream:** ${{ env.UPSTREAM_REPO }}
            - **Branch:** ${{ env.UPSTREAM_BRANCH }}
            - **Workflow Run:** [View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### Action Required
            Please check the failed step in workflow logs and resolve manually if needed:

            \`\`\`bash
            git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
            git fetch upstream ${{ env.UPSTREAM_BRANCH }}
            git merge upstream/${{ env.UPSTREAM_BRANCH }}
            # Resolve conflicts/permission issues...
            git push origin main
            \`\`\`

            After resolving, you can trigger a manual build from the Actions tab.
            `;

            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            if (!repo.has_issues) {
              console.log('Issues are disabled; skip creating notification issue.');
              return;
            }

            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync'
            });

            const existingIssue = issues.data.find(i => i.title === title);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['upstream-sync', 'needs-attention']
              });
            }
