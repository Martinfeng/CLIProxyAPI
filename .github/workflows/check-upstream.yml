name: Check Upstream Release

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  UPSTREAM_REPO: router-for-me/CLIProxyAPI
  UPSTREAM_BRANCH: ${{ github.event.repository.default_branch || 'main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream branch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Check upstream for new release or commits
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get upstream latest release tag
          UPSTREAM_TAG=$(gh release view --repo ${{ env.UPSTREAM_REPO }} --json tagName -q '.tagName' 2>/dev/null || echo "")
          UPSTREAM_HEAD=$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})
          MERGE_BASE=$(git merge-base HEAD upstream/${{ env.UPSTREAM_BRANCH }}) || true
          echo "Upstream latest release: $UPSTREAM_TAG"
          echo "Upstream latest commit: ${UPSTREAM_HEAD:0:7}"

          # Get our latest release tag
          OUR_TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q '.tagName' 2>/dev/null || echo "")
          echo "Our latest release: $OUR_TAG"

          # Extract upstream version from our tag (e.g., v6.7.48 from v6.7.48-fork.1)
          OUR_UPSTREAM_VERSION=$(echo "$OUR_TAG" | sed 's/-fork\.[0-9]*$//')
          echo "Our upstream base: $OUR_UPSTREAM_VERSION"

          # Check if upstream has a newer release
          TAG_ONLY=false
          if [ -z "$UPSTREAM_TAG" ]; then
            if [ "$MERGE_BASE" != "$UPSTREAM_HEAD" ]; then
              echo "Upstream release unavailable, but upstream branch has new commits"
              echo "needs_sync=true" >> $GITHUB_OUTPUT
            else
              echo "Cannot determine upstream release and no upstream branch changes detected"
              echo "needs_sync=false" >> $GITHUB_OUTPUT
            fi
          elif [ "$UPSTREAM_TAG" != "$OUR_UPSTREAM_VERSION" ]; then
            if [ "$MERGE_BASE" = "$UPSTREAM_HEAD" ]; then
              echo "New upstream release $UPSTREAM_TAG points to already-merged commit ${UPSTREAM_HEAD:0:7}; forcing build for release"
              TAG_ONLY=true
            else
              echo "New upstream release detected: $UPSTREAM_TAG (ours: $OUR_UPSTREAM_VERSION)"
            fi
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          elif [ "$MERGE_BASE" != "$UPSTREAM_HEAD" ]; then
            echo "Upstream branch has new commits beyond our synced release"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "Fork already contains upstream release and branch head"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi
          echo "tag_only=$TAG_ONLY" >> $GITHUB_OUTPUT

      - name: Trigger sync workflow
        if: steps.check.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_ONLY: ${{ steps.check.outputs.tag_only }}
        run: |
          if [ "$TAG_ONLY" = "true" ]; then
            gh workflow run sync-upstream.yml --repo ${{ github.repository }} -f force_build=true
            echo "Triggered sync-upstream workflow (force_build=true, tag-only upstream release)"
          else
            gh workflow run sync-upstream.yml --repo ${{ github.repository }}
            echo "Triggered sync-upstream workflow"
          fi
