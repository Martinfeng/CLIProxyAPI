# One-click deployment for CLI Proxy API fork + CPA-Manager Usage Service.
#
# Usage:
#   curl -O https://raw.githubusercontent.com/Martinfeng/CLIProxyAPI/main/docker-compose.yml
#   docker compose up -d
#
# After startup:
#   - CPA main panel:        http://localhost:8317/management.html
#     (uses the seakee/CPA-Manager panel, auto-downloaded on first start)
#   - Usage Service panel:   http://localhost:18317/management.html
#     (SQLite-backed persistent usage analytics)
#
# First-run setup happens entirely in the browser (cloud deploy mode):
# open the panel, configure providers and management password, save.
# All data persists in named volumes; no host directory pre-creation needed.

services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-martinfeng/cli-proxy-api:latest}
    pull_policy: always
    container_name: cli-proxy-api
    restart: unless-stopped
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      # Named volume initialises from the image on first run (binary +
      # config.example.yaml are preserved); subsequent config / static
      # cache written by the panel persist here.
      - cli-proxy-data:/CLIProxyAPI
      - cli-proxy-auths:/root/.cli-proxy-api
    networks:
      - cpa-net

  cpa-manager:
    image: ${CPA_MANAGER_IMAGE:-seakee/cpa-manager:latest}
    pull_policy: always
    container_name: cpa-manager
    restart: unless-stopped
    ports:
      - "18317:18317"
    environment:
      CPA_BASE_URL: ${CPA_BASE_URL:-http://cli-proxy-api:8317}
    volumes:
      - cpa-manager-data:/data
    depends_on:
      - cli-proxy-api
    networks:
      - cpa-net

networks:
  cpa-net:
    driver: bridge

volumes:
  cli-proxy-data:
  cli-proxy-auths:
  cpa-manager-data:
