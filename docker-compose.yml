# One-click deployment for CLI Proxy API fork + CPA-Manager Usage Service.
#
# Usage:
#   curl -O https://raw.githubusercontent.com/Martinfeng/CLIProxyAPI/main/docker-compose.yml
#   docker compose up -d
#
# After startup:
#   - CPA main panel:        http://localhost:8317/management.html
#     (uses the seakee/CPA-Manager panel, auto-downloaded on first start)
#   - Usage Service panel:   http://localhost:18317/management.html
#     (SQLite-backed persistent usage analytics)
#
# Upgrade:
#   docker compose pull && docker compose up -d
# (binaries live in the images; only data sub-directories are persisted in
# named volumes, so image upgrades pick up cleanly.)

services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-kaelsen/cli-proxy-api:latest}
    pull_policy: always
    container_name: cli-proxy-api
    restart: unless-stopped
    environment:
      DEPLOY: ${DEPLOY:-}
      # Drives the directory used for static panel cache, logs, and store
      # local fallbacks. /CLIProxyAPI is the image's WORKDIR; only its
      # data sub-paths are mounted, so the binary itself stays in the image.
      WRITABLE_PATH: /CLIProxyAPI
    entrypoint: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/config/config.yaml"]
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - cli-proxy-config:/CLIProxyAPI/config
      - cli-proxy-static:/CLIProxyAPI/static
      - cli-proxy-logs:/CLIProxyAPI/logs
      - cli-proxy-auths:/root/.cli-proxy-api
    networks:
      - cpa-net

  cpa-manager:
    image: ${CPA_MANAGER_IMAGE:-seakee/cpa-manager:latest}
    pull_policy: always
    container_name: cpa-manager
    restart: unless-stopped
    ports:
      - "18317:18317"
    environment:
      CPA_BASE_URL: ${CPA_BASE_URL:-http://cli-proxy-api:8317}
    volumes:
      - cpa-manager-data:/data
    depends_on:
      - cli-proxy-api
    networks:
      - cpa-net

networks:
  cpa-net:
    driver: bridge

volumes:
  cli-proxy-config:
  cli-proxy-static:
  cli-proxy-logs:
  cli-proxy-auths:
  cpa-manager-data:
