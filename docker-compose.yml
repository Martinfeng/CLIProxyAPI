# One-click deployment for CLI Proxy API fork + CPA-Manager Usage Service.
#
# Initial install (two curls keep the layout identical to upstream so
# `docker compose pull && docker compose up -d` upgrades stay clean):
#
#   curl -O https://raw.githubusercontent.com/Martinfeng/CLIProxyAPI/main/docker-compose.yml
#   curl -o config.yaml https://raw.githubusercontent.com/Martinfeng/CLIProxyAPI/main/config.example.yaml
#   docker compose up -d
#
# After startup:
#   - CPA main panel:        http://localhost:8317/management.html
#     (uses the seakee/CPA-Manager panel, auto-downloaded on first start)
#   - Usage Service panel:   http://localhost:18317/management.html
#     (SQLite-backed persistent usage analytics)
#
# Upgrade:
#   docker compose pull && docker compose up -d

services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-kaelsen/cli-proxy-api:latest}
    pull_policy: always
    container_name: cli-proxy-api
    restart: unless-stopped
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
    networks:
      - cpa-net

  cpa-manager:
    image: ${CPA_MANAGER_IMAGE:-seakee/cpa-manager:latest}
    pull_policy: always
    container_name: cpa-manager
    restart: unless-stopped
    ports:
      - "18317:18317"
    environment:
      CPA_BASE_URL: ${CPA_BASE_URL:-http://cli-proxy-api:8317}
    volumes:
      - cpa-manager-data:/data
    depends_on:
      - cli-proxy-api
    networks:
      - cpa-net

networks:
  cpa-net:
    driver: bridge

volumes:
  cpa-manager-data:
