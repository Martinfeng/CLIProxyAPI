# Official CLIProxyAPI + CPA-Manager-Plus deployment.
# Keep the service names, data mounts, and Compose project name when upgrading.
# No source checkout, image build, or custom CPA binary is required.
services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: always
    container_name: cli-proxy-api
    restart: unless-stopped
    environment:
      DEPLOY: ${DEPLOY:-}
      MANAGEMENT_PASSWORD: ${MANAGEMENT_KEY:?MANAGEMENT_KEY is required. Copy .env.example to .env and set a strong password.}
      NO_PROXY: cpa-manager-plus,cli-proxy-api,localhost,127.0.0.1
      no_proxy: cpa-manager-plus,cli-proxy-api,localhost,127.0.0.1
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    networks:
      - cpa-net

  cpa-manager-plus:
    image: ${CPA_MANAGER_IMAGE:-seakee/cpa-manager-plus:latest}
    pull_policy: always
    container_name: cpa-manager-plus
    restart: unless-stopped
    ports:
      - "18317:18317"
    environment:
      HTTP_ADDR: "0.0.0.0:18317"
      USAGE_DB_PATH: "/data/usage.sqlite"
      CPA_MANAGER_ADMIN_KEY: ${MANAGEMENT_KEY:?MANAGEMENT_KEY is required. Copy .env.example to .env and set a strong password.}
      CPA_MANAGER_DATA_KEY_PATH: "/data/data.key"
      USAGE_COLLECTOR_MODE: "auto"
      USAGE_RESP_QUEUE: "usage"
      USAGE_RESP_POP_SIDE: "right"
      USAGE_BATCH_SIZE: "100"
      USAGE_POLL_INTERVAL_MS: "500"
      USAGE_QUERY_LIMIT: "50000"
      USAGE_CORS_ORIGINS: "*"
      NO_PROXY: cli-proxy-api,cpa-manager-plus,localhost,127.0.0.1
      no_proxy: cli-proxy-api,cpa-manager-plus,localhost,127.0.0.1
    volumes:
      - cpa-manager-plus-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18317/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      - cli-proxy-api
    networks:
      - cpa-net

networks:
  cpa-net:
    driver: bridge

volumes:
  cpa-manager-plus-data:
